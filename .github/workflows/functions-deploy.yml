name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
  workflow_dispatch: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      have_key: ${{ steps.check.outputs.have_key }}
    steps:
      - name: Check for FIREBASE_SERVICE_ACCOUNT_RISKFORM_484809
        id: check
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_RISKFORM_484809 }}" ]; then
            echo "have_key=false" >> $GITHUB_OUTPUT
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_RISKFORM_484809 secret not set. Functions deploy will be skipped."
          else
            echo "have_key=true" >> $GITHUB_OUTPUT
            echo "FIREBASE_SERVICE_ACCOUNT_RISKFORM_484809 present."
          fi

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    if: ${{ needs.preflight.outputs.have_key == 'true' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RISKFORM_484809 }}

      - name: Deploy Firebase Functions
        run: npx firebase-tools deploy --only functions --project riskform-484809 --non-interactive
